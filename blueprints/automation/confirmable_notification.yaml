blueprint:
  name: Confirmable notification with reminders
  description: >-
    Send a templated Companion app notification to a device or notification
    group, with confirmation, reminder, and optional custom action buttons.
    Run the selected button's actions, stop on No or timeout, or resend
    the notification after the reminder delay.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    notification_trigger:
      name: Notification trigger
      description: When to request confirmation.
      selector:
        trigger: {}
    notification_device:
      name: Notification device
      description: >-
        Select the Companion app device that should receive the notification.
        The device must be registered with Home Assistant and able to receive
        push notifications. With a notification group, select a group member
        here for device-action validation; delivery uses only the group.
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: false
    notification_group:
      name: Notification group
      description: >-
        Optional notify action such as notify.family. When supplied, this is
        used instead of Notification device for both sending and clearing.
        All members must support Companion app actionable notifications.
      default: ""
      selector:
        text: {}
    notification_title:
      name: Notification title
      description: Supports templates, evaluated on every send.
      default: Confirmation requested
      selector:
        text: {}
    notification_message:
      name: Notification message
      description: >-
        The question the recipient should answer. Supports templates, including
        conditional messages, evaluated again on every reminder.
      selector:
        text:
          multiline: true
    accept_label:
      name: Accept button label
      description: Text for the button that runs the confirmation actions.
      default: "Yes"
      selector:
        text: {}
    deny_label:
      name: Deny button label
      description: >-
        Text for the button that finishes without running actions.
        Leave blank to hide this button.
      default: "No"
      selector:
        text: {}
    reminder_label:
      name: Reminder button label
      description: >-
        Text for the button that requests another notification later.
        Leave blank to hide this button.
      default: Remind me later
      selector:
        text: {}
    confirmation_actions:
      name: Actions on Yes
      description: These actions run only when the recipient answers Yes.
      selector:
        action: {}
    extra_action_1_label:
      name: Extra button 1 label
      description: Leave blank to hide this button.
      default: ""
      selector:
        text: {}
    extra_action_1:
      name: Extra button 1 actions
      description: Run these actions and finish when extra button 1 is selected.
      default: []
      selector:
        action: {}
    extra_action_2_label:
      name: Extra button 2 label
      description: Leave blank to hide this button.
      default: ""
      selector:
        text: {}
    extra_action_2:
      name: Extra button 2 actions
      description: Run these actions and finish when extra button 2 is selected.
      default: []
      selector:
        action: {}
    reminder_delay:
      name: Reminder delay
      description: How long to wait after Remind me later before sending again.
      default:
        minutes: 15
      selector:
        duration: {}
    response_timeout:
      name: Response timeout
      description: >-
        How long to wait for a response to each notification. On timeout,
        stop without running the confirmation actions.
      default:
        hours: 24
      selector:
        duration: {}

triggers: !input notification_trigger

mode: parallel
max: 10

actions:
  - variables:
      notification_tag: "{{ 'confirmable_' ~ context.id }}"
      notification_group: !input notification_group
      accept_label: !input accept_label
      deny_label: !input deny_label
      reminder_label: !input reminder_label
      extra_action_1_label: !input extra_action_1_label
      extra_action_2_label: !input extra_action_2_label
  - repeat:
      while: "{{ true }}"
      sequence:
        - variables:
            yes_action: "{{ 'YES_' ~ context.id ~ '_' ~ repeat.index }}"
            no_action: "{{ 'NO_' ~ context.id ~ '_' ~ repeat.index }}"
            remind_action: "{{ 'REMIND_' ~ context.id ~ '_' ~ repeat.index }}"
            extra_1_action: "{{ 'EXTRA_1_' ~ context.id ~ '_' ~ repeat.index }}"
            extra_2_action: "{{ 'EXTRA_2_' ~ context.id ~ '_' ~ repeat.index }}"
        - variables:
            notification_data: >-
              {% set buttons = namespace(items=[
                {'action': yes_action, 'title': accept_label}]) %}
              {% for action, title in [
                (no_action, deny_label), (remind_action, reminder_label),
                (extra_1_action, extra_action_1_label),
                (extra_2_action, extra_action_2_label)] %}
                {% if title %}
                  {% set buttons.items = buttons.items +
                    [{'action': action, 'title': title}] %}
                {% endif %}
              {% endfor %}
              {{ {'tag': notification_tag, 'actions': buttons.items} }}
        - if: "{{ notification_group != '' }}"
          then:
            - action: "{{ notification_group }}"
              data:
                title: !input notification_title
                message: !input notification_message
                data: "{{ notification_data }}"
          else:
            - device_id: !input notification_device
              domain: mobile_app
              type: notify
              title: !input notification_title
              message: !input notification_message
              data: "{{ notification_data }}"
        - wait_for_trigger:
            - trigger: event
              id: "yes"
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ yes_action }}"
            - trigger: event
              id: "no"
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ no_action }}"
            - trigger: event
              id: "remind"
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ remind_action }}"
            - trigger: event
              id: "extra_1"
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ extra_1_action }}"
            - trigger: event
              id: "extra_2"
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ extra_2_action }}"
          timeout: !input response_timeout
          continue_on_timeout: true
        - if: "{{ notification_group != '' }}"
          then:
            - action: "{{ notification_group }}"
              continue_on_error: true
              data:
                message: clear_notification
                data:
                  tag: "{{ notification_tag }}"
          else:
            - device_id: !input notification_device
              domain: mobile_app
              type: notify
              continue_on_error: true
              message: clear_notification
              data:
                tag: "{{ notification_tag }}"
        - if: "{{ wait.trigger is not none and wait.trigger.id == 'remind' }}"
          then:
            - delay: !input reminder_delay
          else:
            - choose:
                - conditions: >-
                    {{ wait.trigger is not none and wait.trigger.id == 'yes' }}
                  sequence: !input confirmation_actions
                - conditions: >-
                    {{ wait.trigger is not none and wait.trigger.id == 'extra_1'
                       and extra_action_1_label != '' }}
                  sequence: !input extra_action_1
                - conditions: >-
                    {{ wait.trigger is not none and wait.trigger.id == 'extra_2'
                       and extra_action_2_label != '' }}
                  sequence: !input extra_action_2
            - stop: Request finished.
